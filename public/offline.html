<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Gitanjali Toys Tracker</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            text-align: center;
        }

        .emoji {
            font-size: 4rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            max-width: 280px;
            line-height: 1.6;
        }

        button {
            margin-top: 8px;
            padding: 14px 28px;
            border-radius: 14px;
            background: #6366f1;
            color: #fff;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="emoji">📶</div>
    <h1>You're offline</h1>
    <p>Please check your internet connection and try again. Your data is safe.</p>
    <button onclick="location.reload()">Retry</button>
</body>

</html>
